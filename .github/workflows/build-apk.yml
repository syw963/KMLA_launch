name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Test & build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk kmla-meal-widget.apk

      - uses: actions/upload-artifact@v4
        with:
          name: kmla-meal-widget
          path: kmla-meal-widget.apk

      # 'latest' 릴리스를 항상 최신 빌드로 갱신 → 폰에서 고정 링크로 받을 수 있음
      - name: Move latest tag
        run: |
          git tag -f latest
          git push -f origin latest

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "민사고 급식 위젯 (최신 빌드 #${{ github.run_number }})"
          body: |
            커밋 ${{ github.sha }} 에서 자동 빌드된 APK입니다.
            폰에서 kmla-meal-widget.apk 를 눌러 받은 뒤 설치하세요.
          files: kmla-meal-widget.apk
          make_latest: true
